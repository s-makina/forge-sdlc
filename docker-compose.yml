name: forgesdlc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgesdlc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgesdlc}
      POSTGRES_DB: ${POSTGRES_DB:-forgesdlc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgesdlc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forgesdlc:forgesdlc@postgres:5432/forgesdlc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-change-me-in-production}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-forgesdlc_session}
      BOOTSTRAP_OPERATOR_EMAIL: ${BOOTSTRAP_OPERATOR_EMAIL:-operator@forgesdlc.local}
      BOOTSTRAP_OPERATOR_PASSWORD: ${BOOTSTRAP_OPERATOR_PASSWORD:-change-me}
      EXTERNAL_MODEL_BASE_URL: ${EXTERNAL_MODEL_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LITELLM_CONFIG_PATH: ${LITELLM_CONFIG_PATH:-/app/gateway/config.generated.yaml}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local}
      EXECUTION_MANAGER_URL: ${EXECUTION_MANAGER_URL:-http://execution-manager:8001/api/v1}
      EXECUTION_MANAGER_TOKEN: ${EXECUTION_MANAGER_TOKEN:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./infrastructure/litellm:/app/gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://api:8000/api/v1}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-forgesdlc_session}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard

  temporal:
    image: temporalio/auto-setup:1.29.4
    restart: unless-stopped
    environment:
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-forgesdlc}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-forgesdlc}
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=temporal
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infrastructure/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.29.0
    restart: unless-stopped
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Ollama (local model runtime) — DISABLED by default.
  # Kept commented-out for local/CPU inference without external models.
  # Uncomment to enable, then pull a model, e.g.:
  #   docker compose exec ollama ollama pull llama3.2:3b
  # litellm is configured to use external OpenAI-compatible endpoints
  # instead (see infrastructure/litellm/config.yaml).
  # ------------------------------------------------------------------
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   ports:
  #     - "${OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'CONFIG=/app/gateway/config.yaml; if [ -f /app/gateway/config.generated.yaml ]; then CONFIG=/app/gateway/config.generated.yaml; fi; exec litellm --config "$$CONFIG"'
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-local}
      LITELLM_ENABLE_KEY_AUTH: "false"
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./infrastructure/litellm:/app/gateway:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/health/liveliness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  execution-manager:
    build:
      context: ./services/execution-manager
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://forgesdlc:forgesdlc@postgres:5432/forgesdlc}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
    ports:
      - "${EXECUTION_MANAGER_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8001/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator:
    build:
      context: ./services/orchestrator
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://api:8000}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-forgesdlc-workflows}
    ports:
      - "${ORCHESTRATOR_PORT:-8002}:8002"
    depends_on:
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8002/health'').status==200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  # ollama_data:
